# Transmis à gunicorn. Le chemin complet (/projets/<appli>/…) est conservé : gunicorn retire
# le préfixe grâce à SCRIPT_NAME, et Django (FORCE_SCRIPT_NAME) génère des liens préfixés.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Fourni par Apache (https) : indispensable pour les cookies sécurisés et le CSRF de Django.
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
proxy_read_timeout 30s;
